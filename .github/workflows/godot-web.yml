name: Build & Deploy Web (Godot 4.3)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web Export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot 4.3
        run: |
          mkdir -p ~/godot
          cd ~/godot
          # Use the correct URL pattern for 4.3 stable
          curl -L -o godot.tar.xz "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.tar.xz"
          file godot.tar.xz
          tar -xf godot.tar.xz
          chmod +x Godot_v4.3-stable_linux.x86_64
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Install Web Export Template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -L -o web_templates.zip "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_web_export_templates.tpz"
          file web_templates.zip
          unzip -o web_templates.zip -d ~/.local/share/godot/export_templates/4.3.stable
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Build Web Export
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          ls -la build/web/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4